<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>便签墙 · 我们的小院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="notes.css">
</head>
<body data-page="notes" class="palace">
  <main class="wall">
    <header class="wall-head">
      <div>
        <h1 data-i18n="wallTitle">便签墙</h1>
        <p data-i18n="wallSub"></p>
      </div>
      <button id="add" class="btn-red" data-i18n="newNote">＋ 新便签</button>
    </header>
    <div id="notes" class="notes"></div>
    <p id="empty" class="empty" data-i18n="emptyWall" hidden></p>
  </main>

  <div id="editor" class="modal" hidden>
    <form id="form" class="sheet">
      <h2 id="editHead"></h2>
      <div id="pv" class="note preview">
        <input id="fTitle" class="n-title" data-i18n-ph="titlePh" maxlength="60" autocomplete="off">
        <textarea id="fBody" class="n-body" data-i18n-ph="bodyPh" rows="5" maxlength="1000"></textarea>
      </div>
      <div class="row"><span data-i18n="noteColor"></span><div id="noteColors" class="swatches"></div></div>
      <div class="row"><span data-i18n="textColor"></span><div id="textColors" class="swatches"></div></div>
      <div class="actions">
        <button type="button" id="cancel" class="btn-soft" data-i18n="cancel"></button>
        <button type="submit" class="btn-red" data-i18n="save"></button>
      </div>
    </form>
  </div>

  <a class="credit" href="https://unsplash.com/photos/red-and-white-temple-under-blue-sky-during-daytime-Uk19VsygF9Y" target="_blank" rel="noopener">Photo: Peter Zhou / Unsplash</a>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="notes.js"></script>
</body>
</html>
